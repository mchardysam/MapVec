name=MapVec
version=0.1.0
author=Sam McHardy
maintainer=Sam McHardy
sentence=Offline OpenStreetMap basemaps for microcontrollers: a suburb in ~150 KB, parsed zero-copy, drawn through four pluggable primitives.
paragraph=A tiny versioned binary format (int16 local metres), a dependency-free bounds-checked parser, and a renderer with LOD, viewport rejection and scanline polygon fill for water and parks, all behind a four-function draw interface (adapters for Arduino_GFX or Adafruit_GFX are five lines). A single Python tool turns an OpenStreetMap extract into a map file, and a preview tool renders it to PNG before you flash. This is a map LAYER for your own sketch, not a GPS navigator; if you want the ready-made device, see IceNav or ESP32_GPS.
category=Display
url=https://github.com/mchardysam/MapVec
architectures=*
includes=mapvec.h,mapvec_render.h
